name: superadmin-saas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: superadmin
      POSTGRES_PASSWORD: superadmin
      POSTGRES_DB: superadmin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superadmin -d superadmin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://superadmin:superadmin@postgres:5432/superadmin
      APP_DATABASE_URL: postgresql://app_runtime:app_runtime_dev_password@postgres:5432/superadmin
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: debug
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-2f4ddf144b0232d08862686b03a311fc4ec3504f6addef490ad11d57eb3c0833244c5e1f16941e8bda0a6d5d5a16d64c}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-3f5129ab68890a464c968f8215e4ec8e3dc824a2d2729c4e2472cd1575918ec4}
      PLATFORM_OWNER_EMAIL: ${PLATFORM_OWNER_EMAIL:-owner@superadmin.local}
      PLATFORM_OWNER_NAME: ${PLATFORM_OWNER_NAME:-Platform Owner}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/api:/app/apps/api
      - /app/apps/api/node_modules

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://superadmin:superadmin@postgres:5432/superadmin
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/worker:/app/apps/worker
      - /app/apps/worker/node_modules

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:3001/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ../../apps/web-superadmin:/app/apps/web-superadmin
      - /app/apps/web-superadmin/node_modules

volumes:
  postgres_data:
  redis_data:
