# Sirve el build estatico de una SPA de React Router: cualquier ruta que no
# sea un archivo real cae a index.html (si no, refrescar /clientes/123 en el
# navegador daria 404, porque nginx buscaria ese archivo literal).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite ya llevan hash en el nombre (index-AbC123.js): se
    # pueden cachear agresivamente sin riesgo de servir una version vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
